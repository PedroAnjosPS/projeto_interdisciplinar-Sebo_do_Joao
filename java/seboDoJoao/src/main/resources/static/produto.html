<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto - Sebo do João</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Nosso CSS padronizado (as classes novas dessa tela estão na seção 12 dele) -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="ec-page-vitrine">

    <!-- Cabeçalho da loja: logo + busca centralizada + carrinho + conta (Fazer Login ou
         menu da conta, conforme o login) e, embaixo, a barra de categorias -->
    <header class="ec-admin-header py-3 px-4">
        <div class="ec-header-linha-principal d-flex align-items-center">
            <a href="index.html" class="ec-admin-logo text-decoration-none">
                <img src="imagens/sebo.png" alt="Sebo do João" class="ec-admin-logo-img">
            </a>

            <form action="busca.html" method="get"
                class="input-group ec-search-bar ec-search-bar-central rounded-pill overflow-hidden">
                <input type="text" name="q" class="form-control ec-search-input border-0" placeholder="Pesquisar...">
                <button class="btn ec-search-btn" type="submit" aria-label="Pesquisar"><i class="fas fa-search"></i></button>
            </form>

            <div class="ms-auto d-flex align-items-center gap-4">
                <a href="carrinho.html" class="ec-cart-link ec-icon-sand fs-4 text-decoration-none" aria-label="Carrinho">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="ec-cart-badge d-none" data-ec-badge-carrinho>0</span>
                </a>
                <a href="login.html" class="ec-header-link text-decoration-none d-flex align-items-center gap-2" data-ec-deslogado>
                    <i class="fas fa-user-circle fs-4"></i>
                    <span class="d-none d-sm-inline">Fazer Login</span>
                </a>
                <div class="dropdown d-none" data-ec-logado>
                    <a href="#" class="ec-header-user d-flex align-items-center gap-1 text-decoration-none"
                        data-bs-toggle="dropdown" aria-expanded="false" aria-label="Menu da conta">
                        <i class="fas fa-chevron-down ec-header-chevron"></i>
                        <span class="ec-header-avatar" data-ec-avatar><i class="fas fa-user-circle fs-3"></i></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end ec-dropdown">
                        <li><a class="dropdown-item" href="menu-conta.html"><i class="fas fa-user me-2"></i>Minha conta</a></li>
                        <li><a class="dropdown-item" href="pedidos.html"><i class="fas fa-box me-2"></i>Meus pedidos</a></li>
                        <li><a class="dropdown-item" href="perfil.html"><i class="fas fa-id-card me-2"></i>Informações do perfil</a></li>
                        <li data-ec-so-admin class="d-none"><a class="dropdown-item" href="admin.html"><i class="fas fa-gauge me-2"></i>Painel do administrador</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="index.html" data-ec-sair><i class="fas fa-right-from-bracket me-2"></i>Sair</a></li>
                    </ul>
                </div>
            </div>
        </div>
        <nav class="ec-nav-categories d-flex justify-content-center gap-2 overflow-auto mt-2">
            <a class="nav-link" href="index.html">Todos</a>
            <a class="nav-link" href="busca.html?categoria=Livros">Livros</a>
            <a class="nav-link" href="busca.html?categoria=Discos+de+Vinil">Discos de Vinil</a>
            <a class="nav-link" href="busca.html?categoria=Blu-rays">Blu-rays</a>
            <a class="nav-link" href="busca.html?categoria=Dvds">Dvds</a>
            <a class="nav-link" href="busca.html?categoria=HQs">HQs</a>
            <a class="nav-link" href="busca.html?categoria=Cds">Cds</a>
            <a class="nav-link" href="busca.html?categoria=Fitas+Cassetes">Fitas Cassetes</a>
        </nav>
    </header>

    <main class="container py-5">
        <!-- Preenchido por JS (renderizarProduto) -->
        <div id="conteudo-produto"></div>
    </main>

    <!-- Produtos da mesma categoria (some se não tiver nenhum) -->
    <section id="secao-similares" class="ec-similares py-5 d-none">
        <div class="container">
            <h3 class="ec-similares-titulo text-center fw-bold mb-4">Produtos similares</h3>
            <div id="lista-similares" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4 justify-content-center"></div>
        </div>
    </section>

    <!-- Aviso rápido (aparece no canto inferior esquerdo, ver avisar() no script) -->
    <div class="toast-container position-fixed bottom-0 start-0 p-3">
        <div id="avisoToast" class="toast ec-toast" role="status" aria-live="polite" aria-atomic="true">
            <div class="d-flex align-items-center">
                <div id="avisoToastTexto" class="toast-body"></div>
                <a id="avisoToastLink" href="carrinho.html" class="ec-link-accent fw-semibold text-decoration-none me-2">Ver carrinho</a>
                <button type="button" class="btn-close btn-close-white me-2" data-bs-dismiss="toast" aria-label="Fechar"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
    <!-- Stores (API Java) e código compartilhado (carrinho, login, cabeçalho...) — js/ -->
    <script src="js/produtos-store.js"></script>
    <script src="js/usuario-store.js"></script>
    <script src="js/vitrine.js"></script>
    <script>
        // ===== Página de produto =====
        const idProduto = new URLSearchParams(location.search).get('id');

        function montarProdutoDetalhado(produto) {
            const titulo = escaparHtml(produto.nome);
            const disponivel = CarrinhoStore.disponivel(produto);
            const limite = CarrinhoStore.limiteDeEstoque(produto);

            const conteudoImagem = produto.imagem
                ? `<img src="${escaparHtml(produto.imagem)}" alt="${titulo}">`
                : `<i class="fas ${escaparHtml(produto.icone || 'fa-box')} fa-6x opacity-50"></i>`;

            const etiquetas = [produto.categoria, produto.genero]
                .filter(Boolean)
                .map((texto) => `<span class="badge bg-dark rounded-pill me-2">${escaparHtml(texto)}</span>`)
                .join('');

            let textoEstoque;
            if (!disponivel) {
                textoEstoque = '<span class="ec-admin-status-badge ec-admin-status-esgotado">Produto esgotado</span>';
            } else if (limite === Infinity) {
                textoEstoque = '<span class="ec-admin-status-badge ec-admin-status-ativo">Disponível</span>';
            } else {
                textoEstoque = `<span class="ec-admin-status-badge ec-admin-status-ativo">${limite} ${limite === 1 ? 'unidade' : 'unidades'} em estoque</span>`;
            }

            const atributoDesabilitado = disponivel ? '' : 'disabled';

            return `
                <div class="row g-4">
                    <div class="col-md-6 col-lg-4">
                        <div class="ec-produto-imagem">${conteudoImagem}</div>
                    </div>

                    <div class="col-md-6 col-lg-4">
                        <h1 class="ec-produto-titulo mb-3">${titulo}</h1>
                        <div class="mb-3">${etiquetas}</div>
                        <div class="ec-produto-desc-box">${escaparHtml(produto.descricao || 'Esse produto ainda não tem descrição.')}</div>
                    </div>

                    <div class="col-12 col-lg-4">
                        <div class="ec-price-card">
                            <div class="ec-price-card-topo">
                                <p class="ec-price-big mb-3">${formatarPreco(produto.preco)}</p>
                                <p class="mb-4">${textoEstoque}</p>
                                <div class="d-grid gap-2">
                                    <button id="botao-adicionar" type="button" class="btn ec-btn-dark ec-btn-pill py-2" ${atributoDesabilitado}>
                                        <i class="fas fa-cart-plus me-2"></i>Adicionar ao carrinho
                                    </button>
                                    <button id="botao-comprar-agora" type="button" class="btn ec-btn-outline-primary ec-btn-pill py-2" ${atributoDesabilitado}>
                                        Comprar agora
                                    </button>
                                </div>
                            </div>
                            <div class="ec-price-card-rodape">
                                <strong>Outras formas de pagamento</strong>
                                <ul class="ec-pagamentos">
                                    <li><i class="fas fa-qrcode me-1"></i>Pix</li>
                                    <li><i class="far fa-credit-card me-1"></i>Cartão de crédito</li>
                                    <li><i class="fas fa-barcode me-1"></i>Boleto</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function renderizarSimilares(produtoAtual) {
            const todos = await ProdutosStore.listar();

            // Mesma categoria, sem repetir o produto atual nem mostrar inativos.
            // Os que têm o mesmo gênero vêm primeiro.
            const similares = todos
                .filter((p) => String(p.id) !== String(produtoAtual.id) && p.status !== 'INATIVO')
                .filter((p) => p.categoria === produtoAtual.categoria)
                .sort((a, b) => Number(b.genero === produtoAtual.genero) - Number(a.genero === produtoAtual.genero))
                .slice(0, 3);

            if (!similares.length) return;

            document.getElementById('lista-similares').innerHTML = similares.map(montarCardProduto).join('');
            document.getElementById('secao-similares').classList.remove('d-none');
        }

        async function renderizarProduto() {
            const container = document.getElementById('conteudo-produto');
            const produto = idProduto ? await ProdutosStore.obterPorId(idProduto) : null;

            // Produto "Inativo" é tratado como se não existisse pro cliente
            if (!produto || produto.status === 'INATIVO') {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="fas fa-box-open fa-4x mb-3 ec-icon-sand"></i>
                        <h3 class="ec-heading-dark fw-bold">Produto não encontrado</h3>
                        <p class="ec-admin-empty">Ele pode ter sido removido ou o link está errado.</p>
                        <a href="busca.html" class="btn ec-btn-outline-primary ec-btn-pill px-4">Ver todos os produtos</a>
                    </div>`;
                return;
            }

            document.title = `${produto.nome} - Sebo do João`;
            container.innerHTML = montarProdutoDetalhado(produto);

            document.getElementById('botao-adicionar').addEventListener('click', () => comprarProduto(produto.id));
            document.getElementById('botao-comprar-agora').addEventListener('click', async () => {
                // Adiciona e já vai pro carrinho. Se o item já estava no limite do
                // estoque, o aviso aparece e a pessoa continua aqui.
                const adicionou = await comprarProduto(produto.id);
                if (adicionou) location.href = 'carrinho.html';
            });

            await renderizarSimilares(produto);
        }

        document.addEventListener('DOMContentLoaded', () => {
            atualizarCabecalhoConta();
            ligarBotoesComprar(document.getElementById('lista-similares'));
            renderizarProduto().catch((erro) => {
                console.error('Erro ao carregar o produto:', erro);
                document.getElementById('conteudo-produto').innerHTML =
                    '<p class="text-center mt-4">Erro ao carregar o produto. Tente novamente mais tarde.</p>';
            });
            atualizarBadgeCarrinho();
        });
    </script>
</body>

</html>
