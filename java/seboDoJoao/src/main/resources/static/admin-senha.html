<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Alterar senha - Sebo do João</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Nosso CSS padronizado (as classes da área do administrador estão na seção 14) -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="ec-page-vitrine" data-ec-admin hidden>

    <!-- Cabeçalho da área do administrador -->
    <header class="ec-admin-header py-3 px-4 d-flex align-items-center gap-3">
        <a href="admin.html" class="ec-admin-logo text-decoration-none">
            <img src="imagens/sebo.png" alt="Sebo do João" class="ec-admin-logo-img">
        </a>
        <span class="ec-admin-header-titulo d-none d-lg-inline">Área do administrador</span>
        <nav class="ms-auto d-flex align-items-center gap-4" aria-label="Menu do administrador">
            <a href="admin.html" class="ec-header-link text-decoration-none d-flex align-items-center gap-2">
                <i class="fas fa-gauge"></i><span class="d-none d-md-inline">Painel</span>
            </a>
            <a href="index.html" class="ec-header-link text-decoration-none d-flex align-items-center gap-2">
                <i class="fas fa-store"></i><span class="d-none d-md-inline">Ver loja</span>
            </a>
            <a href="login.html" class="ec-header-link text-decoration-none d-flex align-items-center gap-2"
                data-ec-sair-admin>
                <i class="fas fa-right-from-bracket"></i><span class="d-none d-md-inline">Sair</span>
            </a>
        </nav>
    </header>

    <main class="container py-5" style="max-width: 640px;">
        <div class="d-flex justify-content-between align-items-end mb-5 flex-wrap gap-2">
            <h2 class="ec-admin-title fw-bold mb-0">ALTERAR SENHA</h2>
            <a href="admin.html" class="ec-link-accent text-decoration-none">
                <i class="fas fa-arrow-left me-1"></i>Voltar ao painel
            </a>
        </div>

        <div class="ec-admin-card">
            <div id="mensagem-senha" role="alert"></div>

            <form id="form-senha" novalidate>
                <!-- Campo escondido: ajuda o navegador/gerenciador de senhas a saber de qual conta é a senha -->
                <input type="email" id="senha-usuario" autocomplete="username" hidden>

                <div class="mb-3">
                    <label class="ec-admin-label" for="senha-atual">Senha atual</label>
                    <div class="ec-campo-senha">
                        <input id="senha-atual" type="password" class="form-control ec-admin-input"
                            autocomplete="current-password" aria-describedby="erro-senha-atual">
                        <button type="button" class="ec-btn-olho" data-ec-mostrar-senha="senha-atual"
                            aria-label="Mostrar senha"><i class="fas fa-eye"></i></button>
                    </div>
                    <div id="erro-senha-atual" class="ec-form-erro" role="alert"></div>
                </div>

                <div class="mb-3">
                    <label class="ec-admin-label" for="senha-nova">Nova senha</label>
                    <div class="ec-campo-senha">
                        <input id="senha-nova" type="password" class="form-control ec-admin-input"
                            autocomplete="new-password" aria-describedby="dica-senha-nova erro-senha-nova">
                        <button type="button" class="ec-btn-olho" data-ec-mostrar-senha="senha-nova"
                            aria-label="Mostrar senha"><i class="fas fa-eye"></i></button>
                    </div>
                    <div id="dica-senha-nova" class="ec-form-dica">Mínimo de 8 caracteres.</div>
                    <div id="erro-senha-nova" class="ec-form-erro" role="alert"></div>
                </div>

                <div class="mb-4">
                    <label class="ec-admin-label" for="senha-confirmar">Confirmar nova senha</label>
                    <div class="ec-campo-senha">
                        <input id="senha-confirmar" type="password" class="form-control ec-admin-input"
                            autocomplete="new-password" aria-describedby="erro-senha-confirmar">
                        <button type="button" class="ec-btn-olho" data-ec-mostrar-senha="senha-confirmar"
                            aria-label="Mostrar senha"><i class="fas fa-eye"></i></button>
                    </div>
                    <div id="erro-senha-confirmar" class="ec-form-erro" role="alert"></div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="admin.html" class="btn ec-btn-outline-primary ec-btn-pill px-4">Cancelar</a>
                    <button type="submit" class="btn ec-btn-dark ec-btn-pill px-4">Salvar nova senha</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
    <!-- Código compartilhado (stores, carrinho, login...) — assets/js/vitrine.js -->
    <script src="js/vitrine.js"></script>
    <script>
        const formulario = document.getElementById('form-senha');
        const CAMPOS = ['senha-atual', 'senha-nova', 'senha-confirmar'];

        function mostrarMensagem(texto, tipo) {
            const area = document.getElementById('mensagem-senha');
            area.innerHTML = '';
            if (!texto) return;

            const alerta = document.createElement('div');
            alerta.className = `alert alert-${tipo} mb-3`;
            alerta.textContent = texto;
            area.appendChild(alerta);
        }

        // Mostra (ou limpa) o erro embaixo de um campo. Devolve true se está ok.
        function marcarCampo(id, erro) {
            const input = document.getElementById(id);
            input.classList.toggle('is-invalid', Boolean(erro));
            input.setAttribute('aria-invalid', erro ? 'true' : 'false');
            document.getElementById('erro-' + id).textContent = erro;
            return !erro;
        }

        // Regras de cada campo (a mesma regra de erroDaSenhaNova vem do vitrine.js)
        function conferirCampos() {
            const atual = document.getElementById('senha-atual').value;
            const nova = document.getElementById('senha-nova').value;
            const confirmar = document.getElementById('senha-confirmar').value;

            const erroNova = erroDaSenhaNova(nova) || (nova === atual ? 'A nova senha precisa ser diferente da atual.' : '');
            const resultados = [
                marcarCampo('senha-atual', atual ? '' : 'Digite a senha atual.'),
                marcarCampo('senha-nova', erroNova),
                marcarCampo('senha-confirmar', !confirmar ? 'Confirme a nova senha.' : (confirmar !== nova ? 'A confirmação não é igual à nova senha.' : ''))
            ];
            return resultados.every(Boolean);
        }

        // Campo com erro vai sendo conferido enquanto a pessoa corrige
        CAMPOS.forEach((id) => {
            document.getElementById(id).addEventListener('input', () => {
                if (document.querySelector('.is-invalid')) conferirCampos();
            });
        });

        formulario.addEventListener('submit', async (evento) => {
            evento.preventDefault();
            mostrarMensagem('');

            if (!conferirCampos()) {
                document.querySelector('.is-invalid').focus();
                return;
            }

            const botao = formulario.querySelector('button[type="submit"]');
            botao.disabled = true;

            try {
                await UsuarioStore.alterarSenha(
                    document.getElementById('senha-atual').value,
                    document.getElementById('senha-nova').value,
                    document.getElementById('senha-confirmar').value
                );
                formulario.reset();
                CAMPOS.forEach((id) => marcarCampo(id, ''));
                mostrarMensagem('Senha alterada com sucesso! Use a nova senha no próximo login.', 'success');
            } catch (erro) {
                // O Store também confere tudo (ex.: senha atual errada aparece aqui, no campo certo)
                if (erro.message === 'A senha atual está incorreta.') {
                    marcarCampo('senha-atual', erro.message);
                    document.getElementById('senha-atual').focus();
                } else {
                    mostrarMensagem(erro.message || 'Não foi possível alterar a senha.', 'danger');
                }
            } finally {
                botao.disabled = false;
            }
        });

        document.addEventListener('DOMContentLoaded', async () => {
            if (!(await exigirAdmin())) return;
            document.getElementById('senha-usuario').value = (await UsuarioStore.obter()).email;
        });
    </script>
</body>

</html>
