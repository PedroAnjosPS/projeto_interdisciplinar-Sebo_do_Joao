    <main class="container py-5">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"

    <!-- Stores (API Java) e código compartilhado (carrinho, login, cabeçalho...) — js/ -->
    <script src="js/produtos-store.js"></script>
    <script src="js/usuario-store.js"></script>
    <script src="js/vitrine.js"></script>
    <script>
        // ===== Pedido confirmado / detalhe do pedido =====
        const parametros = new URLSearchParams(location.search);
        const pedidoNovo = parametros.get('novo') === '1';

        // QR Code ILUSTRATIVO (só desenha um quadriculado parecido; não é um QR de verdade).
        // O mesmo texto sempre gera o mesmo desenho.
        function desenharQrIlustrativo(canvas, texto) {
            const modulos = 29;
            const tamanho = 6;
            canvas.width = canvas.height = modulos * tamanho;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let semente = 2166136261;
            for (const c of texto) semente = Math.imul(semente ^ c.charCodeAt(0), 16777619) >>> 0;
            const proximo = () => { semente ^= semente << 13; semente >>>= 0; semente ^= semente >>> 17; semente ^= semente << 5; semente >>>= 0; return semente / 4294967296; };

            const noCanto = (x, y) => (x < 8 && y < 8) || (x >= modulos - 8 && y < 8) || (x < 8 && y >= modulos - 8);
            ctx.fillStyle = '#4D443B';
            for (let y = 0; y < modulos; y++) {
                for (let x = 0; x < modulos; x++) {
                    if (!noCanto(x, y) && proximo() > 0.52) ctx.fillRect(x * tamanho, y * tamanho, tamanho, tamanho);
                }
            }
            // os 3 quadrados de canto
            [[0, 0], [modulos - 7, 0], [0, modulos - 7]].forEach(([x, y]) => {
                ctx.fillStyle = '#4D443B'; ctx.fillRect(x * tamanho, y * tamanho, 7 * tamanho, 7 * tamanho);
                ctx.fillStyle = '#fff'; ctx.fillRect((x + 1) * tamanho, (y + 1) * tamanho, 5 * tamanho, 5 * tamanho);
                ctx.fillStyle = '#4D443B'; ctx.fillRect((x + 2) * tamanho, (y + 2) * tamanho, 3 * tamanho, 3 * tamanho);
            });
        }

        function textoDoPagamento(pg) {
            // O banco guarda a forma ("PIX" ou cartão de crédito), as parcelas e também a bandeira e o
            // final do cartão usado (pagamentos.bandeira / final_cartao). Se esses dois dados não existirem,
            // aparece só "Cartão de crédito".
            if (pg.tipo === 'pix') return 'Pix';
            const nome = pg.bandeira ? (NOMES_DAS_BANDEIRAS[pg.bandeira] || 'Cartão') : 'Cartão de crédito';
            const final = pg.ultimos4 ? ` final ${pg.ultimos4}` : '';
            const parcelas = pg.parcelas === 1
                ? `1x de ${formatarPreco(pg.valorParcela)}`
                : `${pg.parcelas}x de ${formatarPreco(pg.valorParcela)} sem juros`;
            return `${nome}${final} · ${parcelas}`;
        }

        // A situação do pagamento vem do banco (tabela pagamentos): Pendente, Aprovado, Recusado ou Estornado.
        function montarBlocoPix(p) {
            if (p.pagamento.status === 'Aprovado') {
                return `<section class="ec-ped-bloco ec-ped-pix-pago">
                    <i class="fas fa-circle-check me-2"></i>Pix recebido. Obrigado!
                </section>`;
            }
            // Pedido cancelado (pagamento recusado): não há mais nada a pagar
            if (!p.podePagar) return '';
            return `
                <section class="ec-ped-bloco">
                    <h3 class="ec-ped-bloco-titulo"><i class="fas fa-qrcode me-2"></i>Pague com Pix</h3>
                    <p class="ec-texto-suave">Abra o app do seu banco, escolha pagar com Pix e escaneie o QR Code ou cole o código abaixo.</p>
                    <div class="ec-pix">
                        <div class="ec-pix-qr">
                            <canvas id="pix-qr" aria-label="QR Code ilustrativo do Pix"></canvas>
                            <small>QR Code ilustrativo</small>
                        </div>
                        <div class="ec-pix-codigo">
                            <label class="ec-admin-label" for="pix-codigo">Pix copia e cola</label>
                            <textarea id="pix-codigo" class="form-control ec-admin-input" rows="4" readonly>${escaparHtml(p.pagamento.pixCodigo)}</textarea>
                            <div class="d-flex flex-wrap gap-2 mt-3">
                                <button type="button" id="pix-copiar" class="btn ec-btn-dark ec-btn-pill px-4"><i class="far fa-copy me-2"></i>Copiar código</button>
                                <button type="button" id="pix-simular" class="btn ec-btn-outline-primary ec-btn-pill px-4">Simular pagamento</button>
                            </div>
                            <p class="ec-form-dica mt-2 mb-0">Demonstração: este site não cobra de verdade. "Simular pagamento" faz de conta que o Pix foi pago.</p>
                        </div>
                    </div>
                </section>`;
        }

        // Texto e cor de cada situação do pedido (os nomes vêm do banco)
        const ROTULOS_STATUS = {
            'Aguardando pagamento': { texto: 'Aguardando pagamento', classe: 'ec-status-aguardando' },
            'Processando': { texto: 'Pagamento aprovado · em preparação', classe: 'ec-status-ok' },
            'Concluido': { texto: 'Concluído', classe: 'ec-status-ok' },
            'Cancelado': { texto: 'Cancelado', classe: 'ec-status-aguardando' }
        };

        function montarPedidoCompleto(p, nome) {
            const e = p.endereco; // vem do banco (entregas.endereco_id); só seria null se faltasse o endereço
            const [linha1, linha2, linha3] = e ? linhasDoEndereco(e) : ['', '', ''];
            const rotulo = { ...(ROTULOS_STATUS[p.status] || { texto: p.status, classe: 'ec-status-aguardando' }) };
            // Com a entrega já em trânsito, o pedido não está mais em preparação
            if (p.status === PedidosStore.STATUS_PROCESSANDO && p.entrega.status === 'Em transito') {
                rotulo.texto = 'Pagamento aprovado · em trânsito';
            }
            const nomesEntrega = { 'Pendente': 'Pendente', 'Preparando': 'Preparando o envio', 'Em transito': 'Em trânsito', 'Entregue': 'Entregue', 'Cancelado': 'Cancelada' };
            const situacaoEntrega = nomesEntrega[p.entrega.status] || p.entrega.status;
            const itens = p.itens.map((i) => `
                <li class="ec-ped-linha-item">
                    <span class="ec-ped-miniatura"><i class="fas ${escaparHtml(i.icone)}"></i></span>
                    <span class="flex-grow-1">${escaparHtml(i.nome)}<br><small class="ec-texto-suave">${i.quantidade} un. × ${formatarPreco(i.preco)}</small></span>
                    <strong>${formatarPreco(i.preco * i.quantidade)}</strong>
                </li>`).join('');
            const cancelado = p.status === PedidosStore.STATUS_CANCELADO;

            return `
                <section class="ec-ped-banner">
                    <i class="fas ${cancelado ? 'fa-circle-xmark' : p.status === PedidosStore.STATUS_AGUARDANDO ? 'fa-clock' : 'fa-circle-check'} ec-ped-banner-icone"></i>
                    <div>
                        <h2 class="ec-ped-banner-titulo">${cancelado ? 'Pedido cancelado' : pedidoNovo ? 'Pedido confirmado!' : `Pedido ${escaparHtml(p.codigo)}`}</h2>
                        <p class="mb-0">${pedidoNovo && !cancelado ? `Obrigado pela compra, ${escaparHtml(nome)}. ` : ''}Pedido <strong>${escaparHtml(p.codigo)}</strong>
                            · <span class="ec-status ${rotulo.classe}">${escaparHtml(rotulo.texto)}</span></p>
                    </div>
                </section>

                ${p.pagamento.tipo === 'pix' ? montarBlocoPix(p) : ''}

                <div class="row g-4">
                    <div class="col-lg-7">
                        <section class="ec-ped-bloco">
                            <h3 class="ec-ped-bloco-titulo"><i class="fas fa-box me-2"></i>Produtos</h3>
                            <ul class="ec-ped-lista-itens">${itens}</ul>
                        </section>
                    </div>
                    <div class="col-lg-5 d-flex flex-column gap-4">
                        <section class="ec-ped-bloco">
                            <h3 class="ec-ped-bloco-titulo"><i class="fas fa-truck me-2"></i>Entrega</h3>
                            <p class="mb-1"><strong>${escaparHtml(p.frete.nome)}</strong> · ${p.frete.preco ? formatarPreco(p.frete.preco) : 'Grátis'}</p>
                            <p class="ec-texto-suave mb-2">${escaparHtml(p.frete.prazoTexto)}</p>
                            <!-- Situação da entrega, lida da tabela entregas -->
                            <p class="mb-2">Situação: <span class="ec-status ${p.entrega.status === 'Entregue' ? 'ec-status-ok' : 'ec-status-aguardando'}">${escaparHtml(situacaoEntrega)}</span></p>
                            ${p.entrega.codigoRastreio ? `<p class="mb-2">Código de rastreio: <strong>${escaparHtml(p.entrega.codigoRastreio)}</strong></p>` : ''}
                            ${e ? `<p class="mb-0"><strong>${escaparHtml(e.destinatario)}</strong><br>
                                ${escaparHtml(linha1)}<br>${escaparHtml(linha2)}<br>${escaparHtml(linha3)}</p>` : ''}
                        </section>
                        <section class="ec-ped-bloco">
                            <h3 class="ec-ped-bloco-titulo"><i class="fas fa-wallet me-2"></i>Pagamento</h3>
                            <p class="mb-3">${escaparHtml(textoDoPagamento(p.pagamento))}</p>
                            ${p.pagamento.status === 'Estornado' ? '<p class="mb-3"><span class="ec-status ec-status-aguardando">Compra estornada</span></p>' : ''}
                            <dl class="ec-resumo-valores mb-0">
                                <div><dt>Produtos</dt><dd>${formatarPreco(p.subtotal)}</dd></div>
                                <div><dt>Frete</dt><dd>${p.frete.preco ? formatarPreco(p.frete.preco) : 'Grátis'}</dd></div>
                                <div class="ec-resumo-total"><dt>Total</dt><dd>${formatarPreco(p.total)}</dd></div>
                            </dl>
                        </section>
                    </div>
                </div>

                <p id="pedido-erro" class="text-danger text-center mt-3 mb-0" role="alert"></p>
                <div class="d-flex justify-content-center gap-3 flex-wrap mt-4">
                    ${p.podeCancelar ? '<button type="button" id="pedido-cancelar" class="btn ec-btn-outline-primary ec-btn-pill px-4">Cancelar pedido</button>' : ''}
                    <a href="pedidos.html" class="btn ec-btn-outline-primary ec-btn-pill px-4">Meus pedidos</a>
                    <a href="index.html" class="btn ec-btn-dark ec-btn-pill px-4">Continuar comprando</a>
                </div>`;
        }

        async function renderizarPedido(usuario) {
            const area = document.getElementById('pedido-conteudo');
            // O pedido vem do banco (via Java). Se o servidor falhar, mostra o aviso em vez de tela vazia.
            let pedido;
            try {
                pedido = await PedidosStore.obter(parametros.get('id'));
            } catch (erro) {
                area.innerHTML = `<div class="ec-vazio"><i class="fas fa-triangle-exclamation"></i>
                    <p>${escaparHtml(erro.message)}</p>
                    <a href="pedidos.html" class="btn ec-btn-dark ec-btn-pill px-4">Meus pedidos</a></div>`;
                return;
            }
            if (!pedido) {
                area.innerHTML = `<div class="ec-vazio"><i class="fas fa-box-open"></i>
                    <p>Não encontramos esse pedido na sua conta.</p>
                    <a href="pedidos.html" class="btn ec-btn-dark ec-btn-pill px-4">Meus pedidos</a></div>`;
                return;
            }
            area.innerHTML = montarPedidoCompleto(pedido, usuario.nome.split(' ')[0]);
            document.title = `Pedido ${pedido.codigo} - Sebo do João`;

            const mostrarErro = (erro) => { document.getElementById('pedido-erro').textContent = erro.message; };

            // Botão "Cancelar pedido" (o banco confere se ainda dá tempo e devolve o estoque)
            const botaoCancelar = document.getElementById('pedido-cancelar');
            if (botaoCancelar) {
                botaoCancelar.addEventListener('click', async () => {
                    // Sem confirm() do navegador: o primeiro clique pede confirmação no próprio botão
                    if (botaoCancelar.dataset.confirmar !== '1') {
                        botaoCancelar.dataset.confirmar = '1';
                        botaoCancelar.textContent = 'Clique de novo para confirmar o cancelamento';
                        return;
                    }
                    botaoCancelar.disabled = true;
                    try {
                        await PedidosStore.cancelar(pedido.id);
                        renderizarPedido(usuario);
                    } catch (erro) {
                        botaoCancelar.disabled = false;
                        mostrarErro(erro);
                    }
                });
            }

            if (pedido.pagamento.tipo === 'pix' && pedido.podePagar) {
                desenharQrIlustrativo(document.getElementById('pix-qr'), pedido.pagamento.pixCodigo);

                document.getElementById('pix-copiar').addEventListener('click', async (evento) => {
                    const botao = evento.currentTarget;
                    const campo = document.getElementById('pix-codigo');
                    try {
                        await navigator.clipboard.writeText(campo.value);
                    } catch (erro) {
                        campo.select(); // sem permissão de área de transferência: a pessoa copia na mão
                        document.execCommand('copy');
                    }
                    botao.innerHTML = '<i class="fas fa-check me-2"></i>Código copiado!';
                    setTimeout(() => { botao.innerHTML = '<i class="far fa-copy me-2"></i>Copiar código'; }, 2500);
                });

                document.getElementById('pix-simular').addEventListener('click', async () => {
                    try {
                        await PedidosStore.simularPagamentoDoPix(pedido.id);
                        renderizarPedido(usuario);
                    } catch (erro) {
                        mostrarErro(erro);
                    }
                });
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            atualizarCabecalhoConta();
            atualizarBadgeCarrinho();
            const usuario = await exigirCliente();
            if (!usuario) return;
            renderizarPedido(usuario);
        });
    </script>
