<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endereços - Sebo do João</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Nosso CSS padronizado (as classes dessas telas estão na seção 17 dele) -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="ec-page-vitrine">

    <!-- Cabeçalho da loja: logo + busca centralizada + carrinho + conta (Fazer Login ou
         menu da conta, conforme o login) e, embaixo, a barra de categorias -->
    <header class="ec-admin-header py-3 px-4">
        <div class="ec-header-linha-principal d-flex align-items-center">
            <a href="index.html" class="ec-admin-logo text-decoration-none">
                <img src="imagens/sebo.png" alt="Sebo do João" class="ec-admin-logo-img">
            </a>

            <form action="busca.html" method="get"
                class="input-group ec-search-bar ec-search-bar-central rounded-pill overflow-hidden">
                <input type="text" name="q" class="form-control ec-search-input border-0" placeholder="Pesquisar...">
                <button class="btn ec-search-btn" type="submit" aria-label="Pesquisar"><i class="fas fa-search"></i></button>
            </form>

            <div class="ms-auto d-flex align-items-center gap-4">
                <a href="carrinho.html" class="ec-cart-link ec-icon-sand fs-4 text-decoration-none" aria-label="Carrinho">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="ec-cart-badge d-none" data-ec-badge-carrinho>0</span>
                </a>
                <a href="login.html" class="ec-header-link text-decoration-none d-flex align-items-center gap-2" data-ec-deslogado>
                    <i class="fas fa-user-circle fs-4"></i>
                    <span class="d-none d-sm-inline">Fazer Login</span>
                </a>
                <div class="dropdown d-none" data-ec-logado>
                    <a href="#" class="ec-header-user d-flex align-items-center gap-1 text-decoration-none"
                        data-bs-toggle="dropdown" aria-expanded="false" aria-label="Menu da conta">
                        <i class="fas fa-chevron-down ec-header-chevron"></i>
                        <span class="ec-header-avatar" data-ec-avatar><i class="fas fa-user-circle fs-3"></i></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end ec-dropdown">
                        <li><a class="dropdown-item" href="menu-conta.html"><i class="fas fa-user me-2"></i>Minha conta</a></li>
                        <li><a class="dropdown-item" href="pedidos.html"><i class="fas fa-box me-2"></i>Meus pedidos</a></li>
                        <li><a class="dropdown-item" href="perfil.html"><i class="fas fa-id-card me-2"></i>Informações do perfil</a></li>
                        <li data-ec-so-admin class="d-none"><a class="dropdown-item" href="admin.html"><i class="fas fa-gauge me-2"></i>Painel do administrador</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="index.html" data-ec-sair><i class="fas fa-right-from-bracket me-2"></i>Sair</a></li>
                    </ul>
                </div>
            </div>
        </div>
        <nav class="ec-nav-categories d-flex justify-content-center gap-2 overflow-auto mt-2">
            <a class="nav-link" href="index.html">Todos</a>
            <a class="nav-link" href="busca.html?categoria=Livros">Livros</a>
            <a class="nav-link" href="busca.html?categoria=Discos+de+Vinil">Discos de Vinil</a>
            <a class="nav-link" href="busca.html?categoria=Blu-rays">Blu-rays</a>
            <a class="nav-link" href="busca.html?categoria=Dvds">Dvds</a>
            <a class="nav-link" href="busca.html?categoria=HQs">HQs</a>
            <a class="nav-link" href="busca.html?categoria=Cds">Cds</a>
            <a class="nav-link" href="busca.html?categoria=Fitas+Cassetes">Fitas Cassetes</a>
        </nav>
    </header>

    <main class="container py-5">
        <div class="ec-page-title-bar">
            <h2 class="ec-page-title">Endereços</h2>
            <div class="d-flex align-items-center gap-3">
                <a href="menu-conta.html" class="ec-link-voltar"><i class="fas fa-rotate-left me-1"></i>Voltar</a>
                <i class="fas fa-location-dot fs-4 ec-page-title-icone"></i>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <p id="contador-enderecos" class="ec-texto-suave mb-0">&nbsp;</p>
            <button id="botao-novo-endereco" type="button" class="btn ec-btn-dark ec-btn-pill px-4">
                <i class="fas fa-plus me-2"></i>Adicionar endereço
            </button>
        </div>

        <div id="mensagem-pagina" role="status"></div>

        <div id="lista-enderecos" class="row row-cols-1 row-cols-lg-2 g-4"></div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
    <!-- Stores (API Java) e código compartilhado (carrinho, login, cabeçalho...) — js/ -->
    <script src="js/produtos-store.js"></script>
    <script src="js/usuario-store.js"></script>
    <script src="js/vitrine.js"></script>
    <script src="js/formularios-conta.js"></script>
    <script>
        // ===== Tela de endereços =====
        const listaEnderecos = document.getElementById('lista-enderecos');

        function mostrarMensagemDaPagina(texto, tipo = 'success') {
            document.getElementById('mensagem-pagina').innerHTML = texto
                ? `<div class="alert alert-${tipo} mb-4">${escaparHtml(texto)}</div>` : '';
        }

        function montarCartaoDeEndereco(e) {
            const [linha1, linha2, linha3] = linhasDoEndereco(e);
            return `
                <div class="col">
                    <article class="ec-end-card ${e.padrao ? 'ec-end-card-padrao' : ''}" data-id="${escaparHtml(e.id)}">
                        <header class="ec-end-card-topo">
                            <h3 class="ec-end-card-apelido"><i class="fas fa-location-dot me-2"></i>${escaparHtml(e.apelido)}</h3>
                            ${e.padrao ? '<span class="ec-tag-padrao">Padrão</span>' : ''}
                        </header>
                        <p class="ec-end-card-destinatario">${escaparHtml(e.destinatario)} · ${escaparHtml(e.telefone)}</p>
                        <p class="ec-end-card-linhas">${escaparHtml(linha1)}<br>${escaparHtml(linha2)}<br>${escaparHtml(linha3)}</p>
                        <div class="ec-end-card-acoes">
                            <button type="button" class="ec-btn-texto" data-acao="editar"><i class="fas fa-pen me-1"></i>Editar</button>
                            ${e.padrao ? '' : '<button type="button" class="ec-btn-texto" data-acao="padrao"><i class="fas fa-star me-1"></i>Definir como padrão</button>'}
                            <button type="button" class="ec-btn-texto ec-btn-texto-perigo" data-acao="excluir"><i class="far fa-trash-can me-1"></i>Excluir</button>
                        </div>
                    </article>
                </div>`;
        }

        async function renderizarEnderecos() {
            const enderecos = await EnderecosStore.listar();
            document.getElementById('contador-enderecos').textContent = enderecos.length
                ? `${enderecos.length} de ${EnderecosStore.LIMITE} endereços salvos`
                : 'Você ainda não tem endereços salvos.';
            document.getElementById('botao-novo-endereco').disabled = enderecos.length >= EnderecosStore.LIMITE;

            listaEnderecos.innerHTML = enderecos.length
                ? enderecos.map(montarCartaoDeEndereco).join('')
                : `<div class="col-12"><div class="ec-vazio">
                        <i class="fas fa-map-location-dot"></i>
                        <p>Salve um endereço pra finalizar suas compras mais rápido.</p>
                   </div></div>`;
        }

        document.getElementById('botao-novo-endereco').addEventListener('click', async () => {
            mostrarMensagemDaPagina('');
            const salvo = await abrirModalEndereco();
            if (salvo) { await renderizarEnderecos(); mostrarMensagemDaPagina('Endereço salvo!'); }
        });

        // Um único "ouvinte" cuida dos botões de todos os cartões
        listaEnderecos.addEventListener('click', async (evento) => {
            const botao = evento.target.closest('[data-acao]');
            if (!botao) return;
            const id = botao.closest('[data-id]').dataset.id;
            mostrarMensagemDaPagina('');

            try {
                if (botao.dataset.acao === 'editar') {
                    const salvo = await abrirModalEndereco(await EnderecosStore.obter(id));
                    if (salvo) mostrarMensagemDaPagina('Endereço atualizado!');
                } else if (botao.dataset.acao === 'padrao') {
                    await EnderecosStore.definirPadrao(id);
                    mostrarMensagemDaPagina('Endereço padrão alterado.');
                } else if (botao.dataset.acao === 'excluir') {
                    const e = await EnderecosStore.obter(id);
                    const sim = await confirmarAcao({
                        titulo: 'Excluir endereço?',
                        texto: e ? `${e.apelido} — ${linhasDoEndereco(e)[0]}` : 'Esse endereço será removido da sua conta.'
                    });
                    if (!sim) return;
                    await EnderecosStore.remover(id);
                    mostrarMensagemDaPagina('Endereço excluído.');
                }
                await renderizarEnderecos();
            } catch (erro) {
                mostrarMensagemDaPagina(erro.message || 'Algo deu errado. Tente novamente.', 'danger');
            }
        });

        document.addEventListener('DOMContentLoaded', async () => {
            atualizarCabecalhoConta();
            atualizarBadgeCarrinho();
            if (!(await exigirLogin())) return;
            renderizarEnderecos();
        });
    </script>
</body>

</html>
