<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca - Sebo do João</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Nosso CSS padronizado (as classes novas dessa tela estão na seção 12 dele) -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="ec-page-vitrine">

    <!-- Cabeçalho da loja: logo + busca centralizada + carrinho + conta (Fazer Login ou
         menu da conta, conforme o login) e, embaixo, a barra de categorias -->
    <header class="ec-admin-header py-3 px-4">
        <div class="ec-header-linha-principal d-flex align-items-center">
            <a href="index.html" class="ec-admin-logo text-decoration-none">
                <img src="imagens/sebo.png" alt="Sebo do João" class="ec-admin-logo-img">
            </a>

            <form action="busca.html" method="get"
                class="input-group ec-search-bar ec-search-bar-central rounded-pill overflow-hidden">
                <input type="text" name="q" class="form-control ec-search-input border-0" placeholder="Pesquisar...">
                <button class="btn ec-search-btn" type="submit" aria-label="Pesquisar"><i class="fas fa-search"></i></button>
            </form>

            <div class="ms-auto d-flex align-items-center gap-4">
                <a href="carrinho.html" class="ec-cart-link ec-icon-sand fs-4 text-decoration-none" aria-label="Carrinho">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="ec-cart-badge d-none" data-ec-badge-carrinho>0</span>
                </a>
                <a href="login.html" class="ec-header-link text-decoration-none d-flex align-items-center gap-2" data-ec-deslogado>
                    <i class="fas fa-user-circle fs-4"></i>
                    <span class="d-none d-sm-inline">Fazer Login</span>
                </a>
                <div class="dropdown d-none" data-ec-logado>
                    <a href="#" class="ec-header-user d-flex align-items-center gap-1 text-decoration-none"
                        data-bs-toggle="dropdown" aria-expanded="false" aria-label="Menu da conta">
                        <i class="fas fa-chevron-down ec-header-chevron"></i>
                        <span class="ec-header-avatar" data-ec-avatar><i class="fas fa-user-circle fs-3"></i></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end ec-dropdown">
                        <li><a class="dropdown-item" href="menu-conta.html"><i class="fas fa-user me-2"></i>Minha conta</a></li>
                        <li><a class="dropdown-item" href="pedidos.html"><i class="fas fa-box me-2"></i>Meus pedidos</a></li>
                        <li><a class="dropdown-item" href="perfil.html"><i class="fas fa-id-card me-2"></i>Informações do perfil</a></li>
                        <li data-ec-so-admin class="d-none"><a class="dropdown-item" href="admin.html"><i class="fas fa-gauge me-2"></i>Painel do administrador</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="index.html" data-ec-sair><i class="fas fa-right-from-bracket me-2"></i>Sair</a></li>
                    </ul>
                </div>
            </div>
        </div>
        <nav class="ec-nav-categories d-flex justify-content-center gap-2 overflow-auto mt-2">
            <a class="nav-link" href="index.html">Todos</a>
            <a class="nav-link" href="busca.html?categoria=Livros">Livros</a>
            <a class="nav-link" href="busca.html?categoria=Discos+de+Vinil">Discos de Vinil</a>
            <a class="nav-link" href="busca.html?categoria=Blu-rays">Blu-rays</a>
            <a class="nav-link" href="busca.html?categoria=Dvds">Dvds</a>
            <a class="nav-link" href="busca.html?categoria=HQs">HQs</a>
            <a class="nav-link" href="busca.html?categoria=Cds">Cds</a>
            <a class="nav-link" href="busca.html?categoria=Fitas+Cassetes">Fitas Cassetes</a>
        </nav>
    </header>

    <main class="container py-5">
        <div class="mb-4">
            <h2 id="titulo-resultados" class="ec-admin-title fw-bold mb-0">RESULTADOS</h2>
            <p id="subtitulo-busca" class="ec-admin-empty mt-3 mb-0"></p>
        </div>

        <div id="lista-resultados" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-5 g-4"></div>
    </main>

    <!-- Aviso rápido (aparece no canto inferior esquerdo, ver avisar() no script) -->
    <div class="toast-container position-fixed bottom-0 start-0 p-3">
        <div id="avisoToast" class="toast ec-toast" role="status" aria-live="polite" aria-atomic="true">
            <div class="d-flex align-items-center">
                <div id="avisoToastTexto" class="toast-body"></div>
                <a id="avisoToastLink" href="carrinho.html" class="ec-link-accent fw-semibold text-decoration-none me-2">Ver carrinho</a>
                <button type="button" class="btn-close btn-close-white me-2" data-bs-dismiss="toast" aria-label="Fechar"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
    <!-- Stores (API Java) e código compartilhado (carrinho, login, cabeçalho...) — js/ -->
    <script src="js/produtos-store.js"></script>
    <script src="js/usuario-store.js"></script>
    <script src="js/vitrine.js"></script>
    <script>
        // ===== Busca =====
        // A URL pode trazer ?q=termo (barra de pesquisa) e/ou ?categoria=Livros
        // (links da barra de categorias).
        const parametros = new URLSearchParams(location.search);
        const termoBusca = (parametros.get('q') || '').trim();
        const categoriaFiltro = (parametros.get('categoria') || '').trim();

        // Tira acento e deixa minúsculo, pra "ficcao" achar "Ficção"
        function normalizar(texto) {
            return String(texto ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }

        function produtoCombina(produto) {
            if (categoriaFiltro && normalizar(produto.categoria) !== normalizar(categoriaFiltro)) return false;
            if (!termoBusca) return true;

            const textoDoProduto = normalizar([produto.nome, produto.categoria, produto.genero, produto.descricao].join(' '));
            return normalizar(termoBusca).split(/\s+/).every((palavra) => textoDoProduto.includes(palavra));
        }

        async function renderizarResultados() {
            const container = document.getElementById('lista-resultados');
            const todos = await ProdutosStore.listar();

            // Produtos "Inativos" não aparecem pro cliente
            const resultados = todos
                .filter((produto) => produto.status !== 'INATIVO')
                .filter(produtoCombina);

            const total = resultados.length;
            document.getElementById('titulo-resultados').textContent = `${total} ${total === 1 ? 'RESULTADO' : 'RESULTADOS'}`;

            const partes = [];
            if (termoBusca) partes.push(`para "${termoBusca}"`);
            if (categoriaFiltro) partes.push(`na categoria ${categoriaFiltro}`);
            document.getElementById('subtitulo-busca').textContent = partes.length ? `Resultados ${partes.join(' ')}` : 'Todos os produtos';

            if (!total) {
                container.innerHTML = `
                    <p class="ec-admin-empty text-center w-100 mt-4">
                        Nenhum produto encontrado. Tente outro termo ou escolha uma categoria lá em cima.
                        <a href="busca.html" class="ec-link-accent">Ver todos os produtos</a>.
                    </p>`;
                return;
            }

            container.innerHTML = resultados.map(montarCardProduto).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            atualizarCabecalhoConta();
            document.querySelector('input[name="q"]').value = termoBusca;

            // Destaca no menu a categoria que está sendo vista
            document.querySelectorAll('.ec-nav-categories .nav-link').forEach((link) => {
                if (categoriaFiltro && normalizar(link.textContent) === normalizar(categoriaFiltro)) {
                    link.classList.add('ec-ativo');
                }
            });

            ligarBotoesComprar(document.getElementById('lista-resultados'));
            renderizarResultados().catch((erro) => {
                console.error('Erro ao carregar os produtos:', erro);
                document.getElementById('lista-resultados').innerHTML =
                    '<p class="text-center w-100 mt-4">Erro ao carregar os produtos. Tente novamente mais tarde.</p>';
            });
            atualizarBadgeCarrinho();
        });
    </script>
</body>

</html>
