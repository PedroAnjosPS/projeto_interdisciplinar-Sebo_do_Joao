    <!-- Nosso CSS padronizado (as classes novas dessa tela estão na seção 12 dele) -->

</head>

<body class="ec-page-vitrine">

            </form>

            <div class="ms-auto d-flex align-items-center gap-4">

                </a>
                <a href="login.html" class="ec-header-link text-decoration-none d-flex align-items-center gap-2" data-ec-deslogado>
                    <i class="fas fa-user-circle fs-4"></i>
                    <span class="d-none d-sm-inline">Fazer Login</span>

                <div class="dropdown d-none" data-ec-logado>
                    <a href="#" class="ec-header-user d-flex align-items-center gap-1 text-decoration-none"

                        <i class="fas fa-chevron-down ec-header-chevron"></i>
                        <span class="ec-header-avatar" data-ec-avatar><i class="fas fa-user-circle fs-3"></i></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end ec-dropdown">
                        <li><a class="dropdown-item" href="menu-conta.html"><i class="fas fa-user me-2"></i>Minha conta</a></li>
                        <li><a class="dropdown-item" href="pedidos.html"><i class="fas fa-box me-2"></i>Meus pedidos</a></li>
                        <li><a class="dropdown-item" href="perfil.html"><i class="fas fa-id-card me-2"></i>Informações do perfil</a></li>
                        <li data-ec-so-admin class="d-none"><a class="dropdown-item" href="admin.html"><i class="fas fa-gauge me-2"></i>Painel do administrador</a></li>

        <nav class="ec-nav-categories d-flex justify-content-center gap-2 overflow-auto mt-2">

    <main class="container py-5">
        <div class="ec-page-title-bar">
            <h2 class="ec-page-title">Informações do Perfil</h2>
            <div class="d-flex align-items-center gap-3">
                <a href="menu-conta.html" class="ec-link-voltar"><i class="fas fa-rotate-left me-1"></i>Voltar</a>
                <i class="fas fa-user-pen fs-4 ec-page-title-icone"></i>
            </div>
        </div>

        <div class="ec-profile-card">
            <form id="form-perfil" novalidate>
                <div class="row g-4 align-items-start">
                    <div class="col-md-9 order-2 order-md-1">
                        <!-- Preenchido por JS (renderizarPerfil) -->
                        <div id="campos-perfil"></div>
                    </div>
                    <div class="col-md-3 order-1 order-md-2 d-flex flex-column align-items-center gap-2">
                        <!-- Foto de perfil: clicar na câmera abre o seletor de arquivo -->
                        <div class="ec-profile-avatar-wrap">
                            <div id="avatar-perfil" class="ec-profile-avatar"><i class="fas fa-user"></i></div>
                            <label class="ec-avatar-edit" for="campo-foto" title="Alterar foto">
                                <i class="fas fa-camera"></i>
                                <span class="visually-hidden">Alterar foto de perfil</span>
                            </label>
                            <input id="campo-foto" type="file" accept="image/*" class="d-none">
                        </div>
                        <button id="botao-remover-foto" type="button"
                            class="btn btn-link p-0 ec-link-accent text-decoration-none d-none">Remover foto</button>
                    </div>
                </div>

                <hr class="ec-profile-divider">

                <div id="mensagem-perfil"></div>

                <div id="botoes-perfil" class="d-flex justify-content-end gap-2 flex-wrap"></div>
            </form>
        </div>
    </main>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
    <!-- Stores (API Java) e código compartilhado (carrinho, login, cabeçalho...) — js/ -->
    <script src="js/produtos-store.js"></script>
    <script src="js/usuario-store.js"></script>
    <script src="js/vitrine.js"></script>
    <script src="js/perfil.js"></script>
    <script>
        // ===== Tela de informações do perfil =====
        // Os campos ficam numa lista só: dá pra mostrar como texto (modo normal)
        // ou como inputs (modo edição, depois de clicar em "Editar").
        const CAMPOS_PERFIL = [
            { chave: 'nome', rotulo: 'Nome', icone: 'fa-user', tipo: 'text', placeholder: 'Seu nome completo',
              atributos: 'autocomplete="name" maxlength="100"', validar: erroDoNome },
            // E-mail só aparece (somenteLeitura): quem troca é a tela Segurança e Privacidade,
            // que pede a senha da conta antes de mudar.
            { chave: 'email', rotulo: 'E-mail', icone: 'fa-envelope', somenteLeitura: true },
            { chave: 'cpf', rotulo: 'CPF', icone: 'fa-id-card', tipo: 'text', placeholder: '000.000.000-00',
              atributos: 'inputmode="numeric" maxlength="14" autocomplete="off"', mascara: formatarCpf, validar: erroDoCpf },
            { chave: 'telefone', rotulo: 'Telefone', icone: 'fa-phone', tipo: 'tel', placeholder: '(00) 00000-0000',
              atributos: 'inputmode="numeric" autocomplete="tel"', mascara: formatarTelefone, validar: erroDoTelefone },
            
            // ALTERAÇÃO AQUI: Troque de 'nascimento' para 'dataNascimento' para o JS reconhecer o que vem do Java
            { chave: 'dataNascimento', rotulo: 'Data de Nascimento', icone: 'fa-calendar', tipo: 'date',
              atributos: 'min="1900-01-01" max="' + new Date().toISOString().slice(0, 10) + '"', validar: erroDaDataNascimento }
        ];

        const CAMPOS_EDITAVEIS_PERFIL = CAMPOS_PERFIL.filter((campo) => !campo.somenteLeitura);

        const formularioPerfil = document.getElementById('form-perfil');
        const camposPerfil = document.getElementById('campos-perfil');
        const botoesPerfil = document.getElementById('botoes-perfil');
        let usuarioAtual = null;

        // "2007-01-30" -> "30/01/2007" (sem passar por Date, pra não bagunçar o fuso)
        function formatarDataBR(dataISO) {
            const [ano, mes, dia] = String(dataISO || '').split('-');
            return ano && mes && dia ? `${dia}/${mes}/${ano}` : '';
        }

        function mostrarMensagem(texto, tipo) {
            document.getElementById('mensagem-perfil').innerHTML = texto
                ? `<div class="alert alert-${tipo} mb-3">${texto}</div>`
                : '';
        }

        // ----- Validação campo a campo -----
        // Mostra (ou limpa) a mensagem de erro embaixo do campo e pinta a borda de vermelho.
        // Devolve true se o campo está ok.
        function validarCampo(campo) {
            const input = document.getElementById(`campo-${campo.chave}`);
            const erro = campo.validar(input.value.trim());

            input.classList.toggle('is-invalid', Boolean(erro));
            input.setAttribute('aria-invalid', erro ? 'true' : 'false');
            document.getElementById(`erro-campo-${campo.chave}`).textContent = erro;
            return !erro;
        }

        function ligarMascarasEValidacao() {
            CAMPOS_EDITAVEIS_PERFIL.forEach((campo) => {
                const input = document.getElementById(`campo-${campo.chave}`);
                if (campo.mascara) ligarMascara(input, campo.mascara);

                // Ao sair do campo, confere. Se já estava com erro, vai conferindo
                // enquanto digita (o aviso some assim que a pessoa corrige).
                input.addEventListener('blur', () => validarCampo(campo));
                input.addEventListener('input', () => {
                    if (input.classList.contains('is-invalid')) validarCampo(campo);
                });
            });
        }

        function renderizarPerfil(modoEdicao) {
            camposPerfil.innerHTML = CAMPOS_PERFIL.map((campo) => {
                const valorGuardado = usuarioAtual[campo.chave] || '';
                const valor = campo.mascara ? campo.mascara(valorGuardado) : valorGuardado;

                if (!modoEdicao || campo.somenteLeitura) {
                    const dica = modoEdicao && campo.somenteLeitura
                        ? `<div class="ec-profile-dica">Para trocar o e-mail, use <a href="seguranca.html" class="ec-link-accent">Segurança e Privacidade</a>.</div>`
                        : '';
                    const exibicao = campo.chave === 'dataNascimento' ? formatarDataBR(valor) : valor;
                    return `
                        <div class="ec-profile-row${modoEdicao ? ' ec-profile-row-alinhada' : ''}">
                            <i class="fas ${campo.icone}"></i>
                            <span class="ec-profile-label">${campo.rotulo}:</span>
                            <span class="ec-profile-value">${escaparHtml(exibicao) || '—'}</span>
                        </div>${dica}`;
                }

                return `
                    <div class="ec-profile-campo">
                        <label class="ec-profile-row" for="campo-${campo.chave}">
                            <i class="fas ${campo.icone}"></i>
                            <span class="ec-profile-label">${campo.rotulo}:</span>
                            <input id="campo-${campo.chave}" name="${campo.chave}" type="${campo.tipo}"
                                class="form-control ec-admin-input ec-profile-input" value="${escaparHtml(valor)}"
                                placeholder="${campo.placeholder || ''}" aria-describedby="erro-campo-${campo.chave}"
                                ${campo.atributos || ''}>
                        </label>
                        <div id="erro-campo-${campo.chave}" class="ec-profile-erro" role="alert"></div>
                    </div>`;
            }).join('');

            botoesPerfil.innerHTML = modoEdicao
                ? `<button type="button" id="botao-cancelar" class="btn ec-btn-outline-primary ec-btn-pill px-4">Cancelar</button>
                   <button type="submit" class="btn ec-btn-dark ec-btn-pill px-4">Salvar</button>`
                : `<button type="button" id="botao-editar" class="btn ec-btn-dark ec-btn-pill px-4">Editar</button>`;

            if (modoEdicao) {
                ligarMascarasEValidacao();
                document.getElementById('campo-nome').focus();
                document.getElementById('botao-cancelar').addEventListener('click', () => {
                    mostrarMensagem('', '');
                    renderizarPerfil(false);
                });
            } else {
                document.getElementById('botao-editar').addEventListener('click', () => {
                    mostrarMensagem('', '');
                    renderizarPerfil(true);
                });
            }
        }

        // ===== Foto de perfil =====
        
        // Atualiza o avatar na tela e no menu
        function renderizarFoto() {
            const avatar = document.getElementById('avatar-perfil');
            avatar.innerHTML = usuarioAtual.fotoPerfil
                ? `<img src="${escaparHtml(usuarioAtual.fotoPerfil)}" alt="Foto do usuário">`
                : '<i class="fas fa-user"></i>';
            document.getElementById('botao-remover-foto').classList.toggle('d-none', !usuarioAtual.fotoPerfil);
            atualizarCabecalhoConta();
        }

        // Preview da foto (À prova de falhas, sem canvas)
        document.getElementById('campo-foto').addEventListener('change', (evento) => {
            const arquivo = evento.target.files[0];
            if (!arquivo) return;

            if (!arquivo.type.startsWith('image/')) {
                mostrarMensagem('Escolha um arquivo de imagem (JPG, PNG...).', 'warning');
                return;
            }

            const fotoPreview = URL.createObjectURL(arquivo);
            document.getElementById('avatar-perfil').innerHTML = `<img src="${fotoPreview}">`;
            document.getElementById('botao-remover-foto').classList.remove('d-none');
            mostrarMensagem('', ''); 
        });

        // Botão de remover a foto
        document.getElementById('botao-remover-foto').addEventListener('click', async () => {
            const formData = new FormData();
            formData.append('foto', ''); 
            
            try {
                usuarioAtual = await UsuarioStore.salvar(formData);
                renderizarFoto();
                mostrarMensagem('Foto removida.', 'success');
            } catch (erro) {
                mostrarMensagem('Erro ao remover foto.', 'danger');
            }
        });

        // O Salvar definitivo (Envia pro Java)
        formularioPerfil.addEventListener('submit', async (evento) => {
            evento.preventDefault();

            // Só chega aqui no modo edição (o botão Salvar é o único "submit").
            // Confere todos os campos de uma vez, assim aparecem todos os erros juntos.
            const camposComErro = CAMPOS_EDITAVEIS_PERFIL.filter((campo) => !validarCampo(campo));
            if (camposComErro.length) {
                mostrarMensagem('Corrija os campos destacados em vermelho para salvar.', 'danger');
                document.getElementById(`campo-${camposComErro[0].chave}`).focus();
                return;
            }
            mostrarMensagem('', '');

            // FormData porque a API recebe os campos (e a foto) em multipart.
            // O e-mail não vai: ele só muda na tela Segurança e Privacidade.
            const formData = new FormData();

            CAMPOS_EDITAVEIS_PERFIL.forEach((campo) => {
                formData.append(campo.chave, document.getElementById(`campo-${campo.chave}`).value.trim());
            });

            const inputFoto = document.getElementById('campo-foto');
            if (inputFoto.files.length > 0) {
                formData.append('foto', inputFoto.files[0]);
            }

            const botaoSubmit = formularioPerfil.querySelector('button[type="submit"]');
            if (botaoSubmit) botaoSubmit.disabled = true;

            try {
                usuarioAtual = await UsuarioStore.salvar(formData);
                renderizarPerfil(false);
                renderizarFoto();
                mostrarMensagem('Dados atualizados com sucesso!', 'success');
            } catch (erro) {
                mostrarMensagem(escaparHtml(erro.message || 'Não foi possível salvar os dados.'), 'danger');
            } finally {
                if (botaoSubmit) botaoSubmit.disabled = false;
            }
        });

        // Carregamento inicial da página
        document.addEventListener('DOMContentLoaded', async () => {
            usuarioAtual = await exigirLogin();
            if (!usuarioAtual) return;

            renderizarPerfil(false);
            renderizarFoto();
            atualizarBadgeCarrinho();
        });
    </script>
</body>

</html>
